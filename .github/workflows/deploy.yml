name: Deploy to Cloudflare Pages (production)

# Production for airmeiz.com and www.airmeiz.com.
# Destination: Cloudflare account 33c877338d93a3cc446a9b1419a27d5b, Pages project "airmeiz".
# See DEPLOYMENT.md before changing the account or project.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deployment at a time. A newer push waits for the running one
# instead of cancelling it mid-upload.
concurrency:
  group: cloudflare-pages-production-airmeiz
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 33c877338d93a3cc446a9b1419a27d5b
  PAGES_PROJECT: airmeiz
  WRANGLER_VERSION: 4.160.1

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://airmeiz.com
    steps:
      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is not set. See DEPLOYMENT.md (Cloudflare API token)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix react-app

      - name: Build
        run: npm run build

      - name: Deploy to Pages project "airmeiz"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy react-app/dist \
            --project-name="$PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$(printf '%s' "${COMMIT_MESSAGE:-manual deploy}" | head -n1 | cut -c1-200)" \
            --commit-dirty=false

      - name: Verify live domains serve this build
        run: |
          expected=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' react-app/dist/index.html | head -n1)
          echo "Expected bundle: $expected"
          for host in airmeiz.com www.airmeiz.com; do
            ok=""
            for attempt in $(seq 1 18); do
              live=$(curl -fsSL "https://$host/?deploy=$GITHUB_SHA-$attempt" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -n1 || true)
              if [ "$live" = "$expected" ]; then ok=1; break; fi
              echo "$host serves '${live:-nothing}', waiting..."
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error::$host is not serving $expected after 3 minutes"
              exit 1
            fi
            echo "$host OK"
          done
